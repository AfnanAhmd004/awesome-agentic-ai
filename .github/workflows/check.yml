name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catch links that rot
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest && pytest -q
      - run: python scripts/check_list.py
